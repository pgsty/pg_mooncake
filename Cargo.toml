[package]
name = "pg_mooncake"
version = "0.3.4"
edition = "2021"
rust-version = "1.99.1"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["bgworker", "pg18"]
bgworker = ["moonlink_service"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
pg19 = ["pgrx/pg19"]

[dependencies]
libc = "0.2"
moonlink_rpc.path = "moonlink/src/moonlink_rpc"
moonlink_service = { path = "moonlink/src/moonlink_service", optional = true }
native-tls = "0.2"
pgrx = "=0.20.0"
postgres = { git = "https://github.com/Mooncake-Labs/rust-postgres.git", rev = "14c8e599f5551a8caa96ff5023685a6f537a1455" }
postgres-native-tls = { git = "https://github.com/Mooncake-Labs/rust-postgres.git", rev = "14c8e599f5551a8caa96ff5023685a6f537a1455" }
tokio = "1.48"

[profile.release]
codegen-units = 1
debug = 1
lto = "fat"
